services:
  dynamodb-local:
    image: amazon/dynamodb-local:latest
    command: "-jar DynamoDBLocal.jar -sharedDb -dbPath /home/dynamodblocal/data"
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - dynamodb-local-data:/home/dynamodblocal/data

volumes:
  dynamodb-local-data:
