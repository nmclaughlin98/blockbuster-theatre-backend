name: 2. Deploy Stack 🚀

run-name: "🚀 Deploy ${{ inputs.target_stack }} (${{ inputs.target_env }}; Build #${{ inputs.build_number }})"

on:
  workflow_dispatch:
    inputs:
      target_stack:
        description: 'Target stack to deploy'
        required: true
        type: string
      target_env:
        description: 'Target environment'
        required: true
        type: string
      build_number:
        description: 'Resolved build run number'
        required: true
        type: string
      build_run_id:
        description: 'Resolved build workflow run ID'
        required: true
        type: string

permissions:
  id-token: write
  contents: read
  actions: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Download build artifact
        uses: actions/download-artifact@v7
        with:
          name: build-artifact-${{ inputs.build_number }}
          path: cdk-out
          run-id: ${{ inputs.build_run_id }}
          github-token: ${{ github.token }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::334624057595:role/github-actions-deploy-role
          role-session-name: github-actions-deploy
          aws-region: eu-west-2

      - name: Deploy CDK stack
        env:
          TARGET_ENV: ${{ inputs.target_env }}
          TARGET_STACK: ${{ inputs.target_stack }}
        run: |
          if [ "$TARGET_STACK" = "both" ] || [ "$TARGET_STACK" = "all" ]; then
            npx aws-cdk deploy --app "cdk-out/${TARGET_ENV}" --all --context env="$TARGET_ENV" --require-approval never
          elif [ "$TARGET_STACK" = "auth" ]; then
            npx aws-cdk deploy --app "cdk-out/${TARGET_ENV}" "BlockbusterTheatreAuthStack-${TARGET_ENV}" --context env="$TARGET_ENV" --require-approval never
          else
            npx aws-cdk deploy --app "cdk-out/${TARGET_ENV}" "BlockbusterTheatreBackendStack-${TARGET_ENV}" --context env="$TARGET_ENV" --require-approval never
          fi
          echo "Deployment of $TARGET_STACK stack for $TARGET_ENV environment completed."
          echo "Build run ID: ${{ inputs.build_run_id }}"
          echo "Build number: ${{ inputs.build_number }}"
          echo "Target stack: $TARGET_STACK"
          echo "Target environment: $TARGET_ENV"