name: 3. Populate Database On-Demand

on:
  workflow_dispatch:
    inputs:
      table_name:
        description: 'DynamoDB Table Name'
        required: true
        default: 'BlockbusterTheatre'
      aws_region:
        description: 'AWS Region'
        required: true
        default: 'eu-west-2'

jobs:
  populate-db:
    name: Populate DynamoDB Table
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ github.event.inputs.aws_region }}
          role-to-assume: arn:aws:iam::334624057595:role/blockbuster-theatre-github-deploy-role
          role-session-name: github-actions-populate-db

      - name: Execute Population Script
        env:
          TABLE_NAME: ${{ github.event.inputs.table_name }}
          AWS_REGION: ${{ github.event.inputs.aws_region }}
        run: node lib/scripts/seed-db.mjs
