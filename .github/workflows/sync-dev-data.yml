name: Sync Prod Data to Dev

on:
  workflow_dispatch:
    inputs:
      clear_dev_tables:
        description: 'Clear the existing -dev tables before copying production data'
        required: false
        type: boolean
        default: true

permissions:
  contents: read
  id-token: write

jobs:
  sync:
    name: Sync Prod Data to Dev
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Require main branch
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "Run this workflow from main so the reviewed sync script is used."
            exit 1
          fi

      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          ref: main

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-region: eu-west-2
          role-to-assume: arn:aws:iam::334624057595:role/github-actions-deploy-role
          role-session-name: github-actions-sync-dev

      - name: Install Dependencies
        run: npm ci

      - name: Sync Production Data to Dev
        env:
          CLEAR_DEV_TABLES: ${{ inputs.clear_dev_tables }}
          AWS_REGION: eu-west-2
        run: |
          if [ "$CLEAR_DEV_TABLES" = "true" ]; then
            npm run sync:dev -- --clear
          else
            npm run sync:dev
          fi
