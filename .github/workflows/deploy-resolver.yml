name: Resolve Latest Build Number 🔎

run-name: "🔎 Resolve Latest Build (${{ inputs.target_stack }} → ${{ inputs.target_env }})"

on:
  workflow_dispatch:
    inputs:
      target_stack:
        description: 'Target stack'
        required: true
        type: string
      target_env:
        description: 'Target environment'
        required: true
        type: string
      source_branch:
        description: 'Branch to check for latest build first'
        required: false
        default: 'main'
        type: string

permissions:
  actions: write
  contents: read

jobs:
  resolve:
    runs-on: ubuntu-latest
    steps:
      - name: Find latest successful build & trigger deploy.yml
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          BUILD_WORKFLOW_ID=$(gh api "repos/${{ github.repository }}/actions/workflows" \
            --jq '.workflows[] | select(.name | startswith("1. Build and Package")) | .id' | head -n 1)

          LATEST_NUM=$(gh api "repos/${{ github.repository }}/actions/workflows/${BUILD_WORKFLOW_ID}/runs?branch=${{ inputs.source_branch }}&status=success&per_page=1" \
            --jq '.workflow_runs[0].run_number')

          if [ -z "$LATEST_NUM" ] || [ "$LATEST_NUM" = "null" ]; then
            LATEST_NUM=$(gh api "repos/${{ github.repository }}/actions/workflows/${BUILD_WORKFLOW_ID}/runs?branch=main&status=success&per_page=1" \
              --jq '.workflow_runs[0].run_number')
          fi

          if [ -z "$LATEST_NUM" ] || [ "$LATEST_NUM" = "null" ]; then
            echo "Could not find any successful build run."
            exit 1
          fi

          echo "Resolved latest build #${LATEST_NUM}. Triggering deploy.yml..."
          gh workflow run deploy.yml \
            --repo "${{ github.repository }}" \
            --ref "${{ inputs.source_branch }}" \
            -f target_stack="${{ inputs.target_stack }}" \
            -f target_env="${{ inputs.target_env }}" \
            -f build_number="$LATEST_NUM"