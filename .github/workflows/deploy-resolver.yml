name: Resolve Latest Build Number 🔎

run-name: "🔎 Resolve Latest Build (${{ github.event.client_payload.target_stack }} → ${{ github.event.client_payload.target_env }})"

on:
  repository_dispatch:
    types:
      - resolve-latest-build

permissions:
  actions: write
  contents: read

jobs:
  resolve:
    runs-on: ubuntu-latest
    steps:
      - name: Find latest successful build & trigger deploy.yml
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_STACK: ${{ github.event.client_payload.target_stack }}
          TARGET_ENV: ${{ github.event.client_payload.target_env }}
          SOURCE_BRANCH: ${{ github.event.client_payload.source_branch }}
        run: |
          BUILD_WORKFLOW_ID=$(gh api "repos/${{ github.repository }}/actions/workflows" \
            --jq '.workflows[] | select(.name | startswith("1. Build and Package")) | .id' | head -n 1)

          LATEST_NUM=$(gh api "repos/${{ github.repository }}/actions/workflows/${BUILD_WORKFLOW_ID}/runs?branch=${SOURCE_BRANCH}&status=success&per_page=1" \
            --jq '.workflow_runs[0].run_number')

          if [ -z "$LATEST_NUM" ] || [ "$LATEST_NUM" = "null" ]; then
            LATEST_NUM=$(gh api "repos/${{ github.repository }}/actions/workflows/${BUILD_WORKFLOW_ID}/runs?branch=main&status=success&per_page=1" \
              --jq '.workflow_runs[0].run_number')
          fi

          if [ -z "$LATEST_NUM" ] || [ "$LATEST_NUM" = "null" ]; then
            echo "Could not find any successful build run."
            exit 1
          fi

          gh workflow run deploy.yml \
            --repo "${{ github.repository }}" \
            --ref "${SOURCE_BRANCH:-main}" \
            -f target_stack="$TARGET_STACK" \
            -f target_env="$TARGET_ENV" \
            -f build_number="$LATEST_NUM"