name: 2. Deploy Stack
run-name: 'Deploy Stack (Build #${{ inputs.build_number }})'

on:
  workflow_dispatch:
    inputs:
      build_number:
        description: 'Build number to deploy (leave as "latest" or empty for most recent successful build)'
        required: false
        default: 'latest'
        type: string

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Download Build Artifact
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_BUILD_NUMBER: ${{ github.event.inputs.build_number }}
        run: |
          TARGET_BUILD="${INPUT_BUILD_NUMBER:-latest}"

          if [ "$TARGET_BUILD" = "latest" ]; then
            echo "No specific build number provided or set to 'latest'. Fetching latest successful build number..."
            TARGET_BUILD=$(gh run list --workflow build.yml --status success --limit 1 --json number --jq '.[0].number')
            if [ -z "$TARGET_BUILD" ] || [ "$TARGET_BUILD" = "null" ]; then
              echo "Error: No successful build runs found for build.yml."
              exit 1
            fi
            echo "Resolved latest successful build number: ${TARGET_BUILD}"
          fi

          echo "Downloading artifact: build-artifact-${TARGET_BUILD}..."
          gh run download --name "build-artifact-${TARGET_BUILD}" --dir cdk-out

          echo "## 🚀 Deploying Build #${TARGET_BUILD}" >> $GITHUB_STEP_SUMMARY
          echo "**Resolved Build Number:** \`${TARGET_BUILD}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Artifact:** \`build-artifact-${TARGET_BUILD}\`" >> $GITHUB_STEP_SUMMARY

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: eu-west-2
          role-to-assume: arn:aws:iam::334624057595:role/blockbuster-theatre-backend-github-deploy-role
          role-session-name: bb-theatre-gh-actions-deploy

      - name: Deploy CDK Stack
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: npx cdk deploy --app cdk-out --require-approval never
