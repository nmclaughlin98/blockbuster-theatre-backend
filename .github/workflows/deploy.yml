name: 2. Deploy Stack 🚀

run-name: "🚀 Deploy ${{ inputs.target_stack || 'backend' }} (${{ inputs.target_env != 'auto' && inputs.target_env || (github.event.workflow_run.head_branch == 'main' && 'prod' || github.event.workflow_run.head_branch == 'dev' && 'dev' || github.ref == 'refs/heads/main' && 'prod' || 'dev') }}; Build #${{ github.event.workflow_run.run_number || inputs.build_number || 'latest' }})"

on:
  workflow_run:
    workflows:
      - '1. Build and Package 🔨'
    types:
      - completed
    branches:
      - dev
      - main
  workflow_dispatch:
    inputs:
      target_stack:
        description: 'Target stack to deploy'
        required: true
        default: 'backend'
        type: choice
        options:
          - backend
          - auth
          - all
      target_env:
        description: 'Target environment'
        required: true
        default: 'auto'
        type: choice
        options:
          - auto
          - dev
          - prod
      build_number:
        description: 'Build run number (or "latest")'
        required: true
        default: 'latest'
        type: string

permissions:
  id-token: write
  contents: read
  actions: write

jobs:
  deploy:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Resolve environment, build & update run title
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_STACK: ${{ inputs.target_stack || 'backend' }}
          INPUT_ENV: ${{ inputs.target_env || 'auto' }}
          INPUT_BUILD: ${{ inputs.build_number || 'latest' }}
          WORKFLOW_RUN_ID: ${{ github.event.workflow_run.id }}
          WORKFLOW_RUN_NUMBER: ${{ github.event.workflow_run.run_number }}
          WORKFLOW_RUN_BRANCH: ${{ github.event.workflow_run.head_branch }}
        run: |
          # 1. Resolve target environment (dev or prod)
          if [ "$INPUT_ENV" != "auto" ]; then
            TARGET_ENV="$INPUT_ENV"
          elif [ "$WORKFLOW_RUN_BRANCH" = "main" ] || [ "${{ github.ref }}" = "refs/heads/main" ]; then
            TARGET_ENV="prod"
          else
            TARGET_ENV="dev"
          fi
          echo "env=$TARGET_ENV" >> "$GITHUB_OUTPUT"

          # Match the branch that synthesized that environment in build.yml
          BUILD_BRANCH=$([ "$TARGET_ENV" = "prod" ] && echo "main" || echo "dev")

          # 2. Resolve build run ID & number
          if [ -n "$WORKFLOW_RUN_ID" ]; then
            RUN_ID="$WORKFLOW_RUN_ID"
            BUILD_NUM="$WORKFLOW_RUN_NUMBER"
          elif [ "$INPUT_BUILD" != "latest" ] && [ -n "$INPUT_BUILD" ]; then
            BUILD_NUM="$INPUT_BUILD"
            RUN_ID=$(gh run list \
              --repo "${{ github.repository }}" \
              --workflow "build.yml" \
              --json databaseId,number \
              --jq ".[] | select(.number == ${BUILD_NUM}) | .databaseId" | head -n 1)
          else
            LATEST_JSON=$(gh run list \
              --repo "${{ github.repository }}" \
              --workflow "build.yml" \
              --branch "$BUILD_BRANCH" \
              --status success \
              --limit 1 \
              --json databaseId,number \
              --jq '.[0]')
            RUN_ID=$(echo "$LATEST_JSON" | jq -r '.databaseId')
            BUILD_NUM=$(echo "$LATEST_JSON" | jq -r '.number')
          fi

          if [ -z "$RUN_ID" ] || [ "$RUN_ID" = "null" ]; then
            echo "Could not resolve a valid build run ID for branch ${BUILD_BRANCH}."
            exit 1
          fi

          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"
          echo "build_number=$BUILD_NUM" >> "$GITHUB_OUTPUT"

          # 3. Rename manual workflow run to display resolved Build #N instead of #latest
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "$BUILD_NUM" ] && [ "$BUILD_NUM" != "null" ]; then
            gh api \
              --method PATCH \
              "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
              -f name="🚀 Deploy ${TARGET_STACK} (${TARGET_ENV}; Build #${BUILD_NUM})"
          fi

      - name: Download build artifact
        uses: actions/download-artifact@v7
        with:
          name: build-artifact-${{ steps.resolve.outputs.build_number }}
          path: cdk-out
          run-id: ${{ steps.resolve.outputs.run_id }}
          github-token: ${{ github.token }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: eu-west-2

      - name: Deploy CDK stack
        env:
          TARGET_ENV: ${{ steps.resolve.outputs.env }}
          TARGET_STACK: ${{ inputs.target_stack || 'backend' }}
        run: |
          if [ "$TARGET_STACK" = "all" ]; then
            npx aws-cdk deploy --app cdk-out --all --context env="$TARGET_ENV" --require-approval never
          elif [ "$TARGET_STACK" = "auth" ]; then
            npx aws-cdk deploy --app cdk-out "BlockbusterTheatreAuthStack-${TARGET_ENV}" --context env="$TARGET_ENV" --require-approval never
          else
            npx aws-cdk deploy --app cdk-out "BlockbusterTheatreBackendStack-${TARGET_ENV}" --context env="$TARGET_ENV" --require-approval never
          fi