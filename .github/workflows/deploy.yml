name: 2a. Trigger Deploy 🎯

run-name: "🎯 Queue Deploy (${{ inputs.target_stack || 'backend' }} → ${{ inputs.target_env || 'dev' }}; ${{ github.event.workflow_run.run_number && format('Build #{0}', github.event.workflow_run.run_number) || (inputs.build_number != '' && inputs.build_number != 'latest' && format('Build #{0}', inputs.build_number) || 'Latest Build') }})"

on:
  workflow_run:
    workflows:
      - '1. Build and Package 🔨'
    types:
      - completed
    branches:
      - main
  workflow_dispatch:
    inputs:
      target_stack:
        description: 'Target stack to deploy'
        required: true
        default: 'backend'
        type: choice
        options:
          - backend
          - auth
          - both
      target_env:
        description: 'Target environment'
        required: true
        default: 'dev'
        type: choice
        options:
          - dev
          - prod
      build_number:
        description: 'Build run number (or "latest")'
        required: true
        default: 'latest'
        type: string

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Resolve build & dispatch deployment
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_STACK: ${{ inputs.target_stack || 'backend' }}
          TARGET_ENV: ${{ inputs.target_env || 'dev' }}
          INPUT_BUILD: ${{ inputs.build_number || 'latest' }}
          WORKFLOW_RUN_ID: ${{ github.event.workflow_run.id }}
          WORKFLOW_RUN_NUMBER: ${{ github.event.workflow_run.run_number }}
        run: |
          BUILD_WORKFLOW_ID=$(gh api "repos/${{ github.repository }}/actions/workflows" \
            --jq '.workflows[] | select(.name | startswith("1. Build and Package")) | .id' | head -n 1)

          if [ -z "$BUILD_WORKFLOW_ID" ]; then
            echo "Could not find workflow starting with '1. Build and Package'."
            exit 1
          fi

          if [ -n "$WORKFLOW_RUN_ID" ]; then
            RUN_ID="$WORKFLOW_RUN_ID"
            BUILD_NUM="$WORKFLOW_RUN_NUMBER"
          elif [ "$INPUT_BUILD" != "latest" ] && [ -n "$INPUT_BUILD" ]; then
            BUILD_NUM="$INPUT_BUILD"
            RUN_ID=$(gh api "repos/${{ github.repository }}/actions/workflows/${BUILD_WORKFLOW_ID}/runs?per_page=50" \
              --jq ".workflow_runs[] | select(.run_number == ${BUILD_NUM}) | .id" | head -n 1)
          else
            LATEST_JSON=$(gh api "repos/${{ github.repository }}/actions/workflows/${BUILD_WORKFLOW_ID}/runs?branch=${{ github.ref_name }}&status=success&per_page=1" \
              --jq '.workflow_runs[0]')

            if [ -z "$LATEST_JSON" ] || [ "$LATEST_JSON" = "null" ]; then
              LATEST_JSON=$(gh api "repos/${{ github.repository }}/actions/workflows/${BUILD_WORKFLOW_ID}/runs?branch=main&status=success&per_page=1" \
                --jq '.workflow_runs[0]')
            fi

            RUN_ID=$(echo "$LATEST_JSON" | jq -r '.id')
            BUILD_NUM=$(echo "$LATEST_JSON" | jq -r '.run_number')
          fi

          if [ -z "$RUN_ID" ] || [ "$RUN_ID" = "null" ]; then
            echo "Could not resolve a valid build run ID."
            exit 1
          fi

          echo "Dispatching deploy-execute.yml for ${TARGET_STACK} (${TARGET_ENV}; Build #${BUILD_NUM}, run ${RUN_ID})..."
          gh workflow run deploy-execute.yml \
            --repo "${{ github.repository }}" \
            --ref "${{ github.ref_name }}" \
            -f target_stack="$TARGET_STACK" \
            -f target_env="$TARGET_ENV" \
            -f build_number="$BUILD_NUM" \
            -f build_run_id="$RUN_ID"