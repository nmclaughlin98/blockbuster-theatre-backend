name: 2. Deploy Stack 🚀

run-name: "🚀 Deploy ${{ inputs.target_stack || 'backend' }} (${{ inputs.target_env || 'dev' }}; Build #${{ github.event.workflow_run.run_number || inputs.build_number || 'latest' }})"

on:
  workflow_run:
    workflows:
      - '1. Build and Package 🔨'
    types:
      - completed
    branches:
      - main
  workflow_dispatch:
    inputs:
      target_stack:
        description: 'Target stack to deploy'
        required: true
        default: 'backend'
        type: choice
        options:
          - backend
          - auth
          - both
      target_env:
        description: 'Target environment'
        required: true
        default: 'dev'
        type: choice
        options:
          - dev
          - prod
      build_number:
        description: 'Build run number (or "latest")'
        required: true
        default: 'latest'
        type: string

permissions:
  id-token: write
  contents: read
  actions: write

jobs:
  # Fast-path: if manually triggered with "latest", hand off to resolver so the real deploy gets the resolved #number in its title
  handoff-latest:
    if: ${{ github.event_name == 'workflow_dispatch' && (inputs.build_number == 'latest' || inputs.build_number == '') }}
    runs-on: ubuntu-latest
    steps:
      - name: Hand off to latest build resolver
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run deploy-resolver.yml \
            --repo "${{ github.repository }}" \
            --ref "${{ github.ref_name }}" \
            -f target_stack="${{ inputs.target_stack || 'backend' }}" \
            -f target_env="${{ inputs.target_env || 'dev' }}" \
            -f source_branch="${{ github.ref_name }}"

  # Main deploy job: runs whenever a concrete build number is known (workflow_run OR resolved manual run)
  deploy:
    if: ${{ (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success') || (github.event_name == 'workflow_dispatch' && inputs.build_number != 'latest' && inputs.build_number != '') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Resolve build run ID
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
          WORKFLOW_RUN_ID: ${{ github.event.workflow_run.id }}
          WORKFLOW_RUN_NUMBER: ${{ github.event.workflow_run.run_number }}
          INPUT_BUILD: ${{ inputs.build_number }}
        run: |
          if [ -n "$WORKFLOW_RUN_ID" ]; then
            RUN_ID="$WORKFLOW_RUN_ID"
            BUILD_NUM="$WORKFLOW_RUN_NUMBER"
          else
            BUILD_NUM="$INPUT_BUILD"
            BUILD_WORKFLOW_ID=$(gh api "repos/${{ github.repository }}/actions/workflows" \
              --jq '.workflows[] | select(.name | startswith("1. Build and Package")) | .id' | head -n 1)

            RUN_ID=$(gh api "repos/${{ github.repository }}/actions/workflows/${BUILD_WORKFLOW_ID}/runs?per_page=50" \
              --jq ".workflow_runs[] | select(.run_number == ${BUILD_NUM}) | .id" | head -n 1)
          fi

          if [ -z "$RUN_ID" ] || [ "$RUN_ID" = "null" ]; then
            echo "Could not resolve build run ID for Build #${BUILD_NUM}."
            exit 1
          fi

          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"
          echo "build_number=$BUILD_NUM" >> "$GITHUB_OUTPUT"

      - name: Download build artifact
        uses: actions/download-artifact@v7
        with:
          name: build-artifact-${{ steps.resolve.outputs.build_number }}
          path: cdk-out
          run-id: ${{ steps.resolve.outputs.run_id }}
          github-token: ${{ github.token }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::334624057595:role/github-actions-deploy-role
          role-session-name: github-actions-deploy
          aws-region: eu-west-2

      - name: Deploy CDK stack
        env:
          TARGET_ENV: ${{ inputs.target_env || 'dev' }}
          TARGET_STACK: ${{ inputs.target_stack || 'backend' }}
        run: |
          if [ "$TARGET_STACK" = "both" ] || [ "$TARGET_STACK" = "all" ]; then
            npx aws-cdk deploy --app "cdk-out/${TARGET_ENV}" --all --context env="$TARGET_ENV" --require-approval never
          elif [ "$TARGET_STACK" = "auth" ]; then
            npx aws-cdk deploy --app "cdk-out/${TARGET_ENV}" "BlockbusterTheatreAuthStack-${TARGET_ENV}" --context env="$TARGET_ENV" --require-approval never
          else
            npx aws-cdk deploy --app "cdk-out/${TARGET_ENV}" "BlockbusterTheatreBackendStack-${TARGET_ENV}" --context env="$TARGET_ENV" --require-approval never
          fi
          echo "Deployment of $TARGET_STACK stack for $TARGET_ENV environment completed."