name: 2. Deploy Stack 🚀

run-name: "🚀 Deploy ${{ inputs.target_stack || 'backend' }} (${{ inputs.target_env || 'dev' }}; Build #${{ github.event.workflow_run.run_number || inputs.build_number || 'latest' }})"

on:
  workflow_run:
    workflows:
      - '1. Build and Package 🔨'
    types:
      - completed
    branches:
      - main
  workflow_dispatch:
    inputs:
      target_stack:
        description: 'Target stack to deploy'
        required: true
        default: 'backend'
        type: choice
        options:
          - backend
          - auth
          - both
      target_env:
        description: 'Target environment'
        required: true
        default: 'dev'
        type: choice
        options:
          - dev
          - prod
      build_number:
        description: 'Build run number (or "latest")'
        required: true
        default: 'latest'
        type: string

permissions:
  id-token: write
  contents: read
  actions: write

jobs:
  deploy:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Resolve environment, build & update run title
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_STACK: ${{ inputs.target_stack || 'backend' }}
          INPUT_ENV: ${{ inputs.target_env || '' }}
          INPUT_BUILD: ${{ inputs.build_number || 'latest' }}
          WORKFLOW_RUN_ID: ${{ github.event.workflow_run.id }}
          WORKFLOW_RUN_NUMBER: ${{ github.event.workflow_run.run_number }}
        run: |
          # 1. Resolve target environment (auto pushes on main -> dev; manual -> chosen input)
          if [ -n "$INPUT_ENV" ]; then
            TARGET_ENV="$INPUT_ENV"
          else
            TARGET_ENV="dev"
          fi
          echo "env=$TARGET_ENV" >> "$GITHUB_OUTPUT"

          # Resolve the Build workflow ID by name
          BUILD_WORKFLOW_ID=$(gh api "repos/${{ github.repository }}/actions/workflows" \
            --jq '.workflows[] | select(.name | startswith("1. Build and Package")) | .id' | head -n 1)

          if [ -z "$BUILD_WORKFLOW_ID" ]; then
            echo "Could not find workflow starting with '1. Build and Package'."
            exit 1
          fi

          # 2. Resolve build run ID & number
          if [ -n "$WORKFLOW_RUN_ID" ]; then
            RUN_ID="$WORKFLOW_RUN_ID"
            BUILD_NUM="$WORKFLOW_RUN_NUMBER"
          elif [ "$INPUT_BUILD" != "latest" ] && [ -n "$INPUT_BUILD" ]; then
            BUILD_NUM="$INPUT_BUILD"
            RUN_ID=$(gh api "repos/${{ github.repository }}/actions/workflows/${BUILD_WORKFLOW_ID}/runs?per_page=50" \
              --jq ".workflow_runs[] | select(.run_number == ${BUILD_NUM}) | .id" | head -n 1)
          else
            # Check latest successful build on current branch first (e.g. feature branch), else main
            LATEST_JSON=$(gh api "repos/${{ github.repository }}/actions/workflows/${BUILD_WORKFLOW_ID}/runs?branch=${{ github.ref_name }}&status=success&per_page=1" \
              --jq '.workflow_runs[0]')

            if [ -z "$LATEST_JSON" ] || [ "$LATEST_JSON" = "null" ]; then
              LATEST_JSON=$(gh api "repos/${{ github.repository }}/actions/workflows/${BUILD_WORKFLOW_ID}/runs?branch=main&status=success&per_page=1" \
                --jq '.workflow_runs[0]')
            fi

            RUN_ID=$(echo "$LATEST_JSON" | jq -r '.id')
            BUILD_NUM=$(echo "$LATEST_JSON" | jq -r '.run_number')
          fi

          if [ -z "$RUN_ID" ] || [ "$RUN_ID" = "null" ]; then
            echo "Could not resolve a valid build run ID."
            exit 1
          fi

          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"
          echo "build_number=$BUILD_NUM" >> "$GITHUB_OUTPUT"

          # 3. Rename manual workflow run to display resolved Build #N instead of #latest
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "$BUILD_NUM" ] && [ "$BUILD_NUM" != "null" ]; then
            gh api \
              --method PATCH \
              "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
              -f name="🚀 Deploy ${TARGET_STACK} (${TARGET_ENV}; Build #${BUILD_NUM})"
          fi

      - name: Download build artifact
        uses: actions/download-artifact@v7
        with:
          name: build-artifact-${{ steps.resolve.outputs.build_number }}
          path: cdk-out
          run-id: ${{ steps.resolve.outputs.run_id }}
          github-token: ${{ github.token }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::334624057595:role/github-actions-deploy-role
          role-session-name: github-actions-deploy
          aws-region: eu-west-2

      - name: Deploy CDK stack
        env:
          TARGET_ENV: ${{ steps.resolve.outputs.env }}
          TARGET_STACK: ${{ inputs.target_stack || 'backend' }}
        run: |
          if [ "$TARGET_STACK" = "both" ] || [ "$TARGET_STACK" = "all" ]; then
            npx aws-cdk deploy --app "cdk-out/${TARGET_ENV}" --all --context env="$TARGET_ENV" --require-approval never
          elif [ "$TARGET_STACK" = "auth" ]; then
            npx aws-cdk deploy --app "cdk-out/${TARGET_ENV}" "BlockbusterTheatreAuthStack-${TARGET_ENV}" --context env="$TARGET_ENV" --require-approval never
          else
            npx aws-cdk deploy --app "cdk-out/${TARGET_ENV}" "BlockbusterTheatreBackendStack-${TARGET_ENV}" --context env="$TARGET_ENV" --require-approval never
          fi
            echo "Deployment of $TARGET_STACK stack for $TARGET_ENV environment completed."